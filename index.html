<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Graficador bursátil</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{
  --bg:#020617; --panel:#0f172a; --line:#1e293b; --line2:#334155;
  --txt:#e2e8f0; --mut:#94a3b8; --blue:#2563eb; --amber:#f59e0b;
}
*{box-sizing:border-box}
html,body{
  height:100%; margin:0; padding:0; overflow:hidden;
  background:var(--bg); color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
}
body{
  display:flex; flex-direction:column;
  height:100vh; height:100dvh;
  padding-top:env(safe-area-inset-top);
}
button{font-family:inherit; user-select:none; -webkit-user-select:none}
.hidden{display:none !important}

/* Cabecera */
header{background:var(--panel); border-bottom:1px solid var(--line); padding:10px; flex:0 0 auto; z-index:40}
.header-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:11px; color:var(--mut)}
.version-tag{background:var(--line2); padding:2px 6px; border-radius:4px; font-family:monospace; color:#38bdf8; font-weight:700}

form{margin:0; display:flex; flex-direction:column; gap:8px}
.row{display:flex; align-items:center; gap:8px}
.row + .row{padding-top:8px; border-top:1px solid var(--line)}
.field{
  flex:1; min-width:0; display:flex; align-items:center; gap:6px; position:relative;
  background:var(--line); border:1px solid var(--line2); border-radius:6px; padding:2px 6px 2px 10px;
}
.tag{font-size:10px; font-weight:700; text-transform:uppercase; flex:0 0 auto}
.tag.a1{color:var(--mut)} .tag.a2{color:var(--amber)}
.field input{
  flex:1; min-width:0; background:transparent; border:0; outline:0;
  font-size:16px; font-weight:700; text-transform:uppercase; padding:7px 0;
  -webkit-user-select:text; user-select:text;
}
#inputAsset1{color:#60a5fa} #inputAsset2{color:var(--amber)}
.go{background:var(--blue); color:#fff; border:0; border-radius:5px; font-size:12px; font-weight:700; padding:7px 14px; cursor:pointer}
.go:active{background:#1d4ed8}

.pin-btn{background:var(--line2); color:var(--mut); border:0; border-radius:5px; font-size:14px; padding:7px 10px; cursor:pointer; transition:background .15s, color .15s}
.pin-btn.pinned{background:var(--amber); color:#020617}

.pill{
  background:var(--line); color:#cbd5e1; border:1px solid var(--line2); border-radius:999px;
  padding:8px 14px; font-size:12px; font-weight:500; white-space:nowrap; cursor:pointer; flex:0 0 auto;
  transition:background .15s,border-color .15s;
}
.pill:hover{border-color:#475569}
.pill.on{background:var(--blue); border-color:var(--blue); color:#fff}

/* Área de gráficos */
#wrap{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; background:var(--bg)}
.mainbox{position:relative; flex:1 0 220px; min-height:220px}
.cbox{position:absolute; inset:0; overflow:hidden}
.panel{position:relative; flex:0 0 72px; height:72px; border-top:1px solid var(--line)}
.plabel{position:absolute; top:2px; left:6px; z-index:3; font-size:10px; color:#64748b; pointer-events:none}

.legend{
  position:absolute; top:8px; left:8px; z-index:5; max-width:calc(100% - 16px);
  background:rgba(15,23,42,.92); border:1px solid var(--line); border-radius:6px;
  padding:6px 10px; font-size:11px; line-height:1.35; color:#cbd5e1; pointer-events:none;
}
.legend.err{color:#fca5a5; border-color:#7f1d1d}
.attr{position:absolute; bottom:30px; left:8px; z-index:4; font-size:9px; color:#475569; text-decoration:none}

.overlay{
  position:absolute; inset:0; z-index:20; background:rgba(2,6,23,.8);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
  font:12px ui-monospace,Menlo,Consolas,monospace; color:#cbd5e1;
}
.spin{width:32px; height:32px; border:3px solid #3b82f6; border-top-color:transparent; border-radius:50%; animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#timerCount{color:#60a5fa; font-weight:700}

/* Pie: indicadores */
footer{
  flex:0 0 auto; display:flex; align-items:center; gap:8px; overflow-x:auto;
  background:var(--panel); border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom)); z-index:20;
  scrollbar-width:none; -ms-overflow-style:none;
}
footer::-webkit-scrollbar{display:none}
#btnRefresh{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700}
</style>
</head>

<script>
'use strict';

const APP_VERSION = 'v2.3-AlphaVantage';
console.log('🚀 Ejecutando Graficador Bursátil - Versión:', APP_VERSION);

const VISIBLE_BARS = 250;
const CACHE_TTL_MS = 4 * 3600 * 1000;
const FETCH_TIMEOUT_MS = 8000;
const AV_API_KEY = 'demo'; 
const PINNED_KEY = 'av_pinned_asset';

const $ = id => document.getElementById(id);
const legend = $('legendInfo');
const legendBox = $('legendBox');
let legendBase = '';
let flashTimer = null;

function setLegend(text, isError) {
  clearTimeout(flashTimer);
  legendBase = text;
  legend.textContent = text;
  legendBox.classList.toggle('err', !!isError);
}
function flash(text) {
  clearTimeout(flashTimer);
  legend.textContent = text;
  flashTimer = setTimeout(() => { legend.textContent = legendBase; }, 2500);
}

window.addEventListener('error', e => setLegend('Error: ' + e.message, true));
window.addEventListener('unhandledrejection', e => setLegend('Error: ' + (e.reason && e.reason.message || e.reason), true));

if (typeof LightweightCharts === 'undefined') {
  setLegend('No se cargó la librería de gráficos (red o bloqueador).', true);
  throw new Error('LightweightCharts no disponible');
}

let timerInterval = null;
function startTimer() {
  stopTimer();
  const t0 = Date.now();
  $('timerCount').textContent = '0.0s';
  $('loadingOverlay').classList.remove('hidden');
  timerInterval = setInterval(() => {
    $('timerCount').textContent = ((Date.now() - t0) / 1000).toFixed(1) + 's';
  }, 100);
}
function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  $('loadingOverlay').classList.add('hidden');
}

/* ================================================================
   INDICADORES TÉCNICOS (Incluyendo FRAMA y FRAMA Bollinger)
   ================================================================ */
const nulls = n => new Array(n).fill(null);

function sma(v, p) {
  const o = nulls(v.length);
  for (let i = p - 1; i < v.length; i++) {
    let s = 0, ok = true;
    for (let j = i - p + 1; j <= i; j++) {
      if (v[j] == null) { ok = false; break; }
      s += v[j];
    }
    if (ok) o[i] = s / p;
  }
  return o;
}

function ema(v, p) {
  const o = nulls(v.length), k = 2 / (p + 1);
  let run = 0, first = -1;
  for (let i = 0; i < v.length; i++) {
    run = v[i] == null ? 0 : run + 1;
    if (run === p) { first = i; break; }
  }
  if (first < 0) return o;
  let s = 0;
  for (let j = first - p + 1; j <= first; j++) s += v[j];
  let prev = s / p;
  o[first] = prev;
  for (let i = first + 1; i < v.length; i++) {
    if (v[i] == null) continue;
    prev = v[i] * k + prev * (1 - k);
    o[i] = prev;
  }
  return o;
}

function bollinger(c, p = 20, m = 2) {
  const up = nulls(c.length), lo = nulls(c.length);
  for (let i = p - 1; i < c.length; i++) {
    let s = 0;
    for (let j = i - p + 1; j <= i; j++) s += c[j];
    const mean = s / p;
    let q = 0;
    for (let j = i - p + 1; j <= i; j++) q += (c[j] - mean) ** 2;
    const sd = Math.sqrt(q / p);
    up[i] = mean + m * sd;
    lo[i] = mean - m * sd;
  }
  return { up, lo };
}

// FRAMA (Fractal Adaptive Moving Average - John Ehlers)
function frama(closes, highs, lows, p = 30) {
  const n = closes.length, o = nulls(n);
  const half = Math.floor(p / 2);
  if (n < p) return o;

  for (let i = p - 1; i < n; i++) {
    let h1 = -Infinity, l1 = Infinity;
    for (let j = i - half + 1; j <= i; j++) {
      if (highs[j] > h1) h1 = highs[j];
      if (lows[j] < l1) l1 = lows[j];
    }
    const N1 = (h1 - l1) / half;

    let h2 = -Infinity, l2 = Infinity;
    for (let j = i - p + 1; j <= i - half; j++) {
      if (highs[j] > h2) h2 = highs[j];
      if (lows[j] < l2) l2 = lows[j];
    }
    const N2 = (h2 - l2) / half;

    let h3 = -Infinity, l3 = Infinity;
    for (let j = i - p + 1; j <= i; j++) {
      if (highs[j] > h3) h3 = highs[j];
      if (lows[j] < l3) l3 = lows[j];
    }
    const N3 = (h3 - l3) / p;

    let dim = 1;
    if ((N1 + N2) > 0 && N3 > 0) {
      dim = (Math.log(N1 + N2) - Math.log(N3)) / Math.log(2);
    }

    let alpha = Math.exp(-4.6 * (dim - 1));
    alpha = Math.max(0.01, Math.min(1, alpha));

    if (i === p - 1 || o[i - 1] == null) {
      o[i] = closes[i];
    } else {
      o[i] = alpha * closes[i] + (1 - alpha) * o[i - 1];
    }
  }
  return o;
}

// Bandas de Bollinger basadas en FRAMA
function framaBollinger(closes, highs, lows, p = 30, m = 2) {
  const mid = frama(closes, highs, lows, p);
  const up = nulls(closes.length), lo = nulls(closes.length);
  for (let i = p - 1; i < closes.length; i++) {
    if (mid[i] == null) continue;
    let sumSq = 0, count = 0;
    for (let j = i - p + 1; j <= i; j++) {
      sumSq += (closes[j] - mid[i]) ** 2;
      count++;
    }
    const sd = Math.sqrt(sumSq / count);
    up[i] = mid[i] + m * sd;
    lo[i] = mid[i] - m * sd;
  }
  return { mid, up, lo };
}

function rsi(c, p = 14) {
  const n = c.length, o = nulls(n);
  if (n <= p) return o;
  const calc = (ag, al) => al === 0 ? (ag === 0 ? 50 : 100) : 100 - 100 / (1 + ag / al);
  let g = 0, l = 0;
  for (let i = 1; i <= p; i++) {
    const d = c[i] - c[i - 1];
    if (d >= 0) g += d; else l -= d;
  }
  let ag = g / p, al = l / p;
  o[p] = calc(ag, al);
  for (let i = p + 1; i < n; i++) {
    const d = c[i] - c[i - 1];
    ag = (ag * (p - 1) + (d > 0 ? d : 0)) / p;
    al = (al * (p - 1) + (d < 0 ? -d : 0)) / p;
    o[i] = calc(ag, al);
  }
  return o;
}

function macd(c) {
  const e12 = ema(c, 12), e26 = ema(c, 26);
  const line = c.map((_, i) => (e12[i] != null && e26[i] != null) ? e12[i] - e26[i] : null);
  const signal = ema(line, 9);
  const hist = line.map((v, i) => (v != null && signal[i] != null) ? v - signal[i] : null);
  return { line, signal, hist };
}

function obv(bars) {
  let acc = 0;
  return bars.map((b, i) => {
    if (i > 0) {
      if (b.close > bars[i - 1].close) acc += b.volume;
      else if (b.close < bars[i - 1].close) acc -= b.volume;
    }
    return acc;
  });
}

function stoch(bars, kp = 14, dp = 3) {
  const k = nulls(bars.length);
  for (let i = kp - 1; i < bars.length; i++) {
    let hh = -Infinity, ll = Infinity;
    for (let j = i - kp + 1; j <= i; j++) {
      if (bars[j].high > hh) hh = bars[j].high;
      if (bars[j].low < ll) ll = bars[j].low;
    }
    k[i] = hh === ll ? 50 : ((bars[i].close - ll) / (hh - ll)) * 100;
  }
  return { k, d: sma(k, dp) };
}

function atr(bars, p = 14) {
  const n = bars.length, o = nulls(n);
  if (n < p) return o;
  const tr = bars.map((b, i) => i === 0
    ? b.high - b.low
    : Math.max(b.high - b.low, Math.abs(b.high - bars[i - 1].close), Math.abs(b.low - bars[i - 1].close)));
  let s = 0;
  for (let i = 0; i < p; i++) s += tr[i];
  o[p - 1] = s / p;
  for (let i = p; i < n; i++) o[i] = (o[i - 1] * (p - 1) + tr[i]) / p;
  return o;
}

function vwapAnchored(bars, start) {
  const o = nulls(bars.length);
  let tpv = 0, vol = 0;
  for (let i = start; i < bars.length; i++) {
    const tp = (bars[i].high + bars[i].low + bars[i].close) / 3;
    tpv += tp * bars[i].volume;
    vol += bars[i].volume;
    if (vol > 0) o[i] = tpv / vol;
  }
  return o;
}

function parabolicSar(bars, step = 0.02, max = 0.2) {
  const n = bars.length, o = nulls(n);
  if (n < 2) return o;
  let rising = bars[1].close >= bars[0].close;
  let sar = rising ? bars[0].low : bars[0].high;
  let ep = rising ? bars[0].high : bars[0].low;
  let af = step;
  for (let i = 1; i < n; i++) {
    sar = sar + af * (ep - sar);
    const j = i >= 2 ? i - 2 : i - 1;
    if (rising) {
      sar = Math.min(sar, bars[i - 1].low, bars[j].low);
      if (bars[i].low < sar) { rising = false; sar = ep; ep = bars[i].low; af = step; }
      else if (bars[i].high > ep) { ep = bars[i].high; af = Math.min(af + step, max); }
    } else {
      sar = Math.max(sar, bars[i - 1].high, bars[j].high);
      if (bars[i].high > sar) { rising = true; sar = ep; ep = bars[i].high; af = step; }
      else if (bars[i].low < ep) { ep = bars[i].low; af = Math.min(af + step, max); }
    }
    o[i] = sar;
  }
  return o;
}

/* ================================================================
   DATOS: Alpha Vantage API con caché local
   ================================================================ */
function cacheGet(key) {
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch { return null; }
}
function cacheSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
}

async function fetchJSON(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    const text = await res.text();
    try { return JSON.parse(text); } catch { return null; }
  } finally {
    clearTimeout(timer);
  }
}

function definitiveError(msg) { const e = new Error(msg); e.definitive = true; return e; }

function parseAlphaVantage(json, ticker) {
  if (!json) throw definitiveError('Respuesta vacía del proveedor');
  if (json.Note || json.Information) {
    throw definitiveError('Límite de peticiones de Alpha Vantage alcanzado (espera un minuto).');
  }
  if (json['Error Message']) {
    throw definitiveError('Ticker «' + ticker + '» no encontrado.');
  }
  const ts = json['Time Series (Daily)'];
  if (!ts) {
    throw definitiveError('Sin datos históricos para ' + ticker);
  }
  const bars = [];
  for (const [date, vals] of Object.entries(ts)) {
    const o = parseFloat(vals['1. open']);
    const h = parseFloat(vals['2. high']);
    const l = parseFloat(vals['3. low']);
    const c = parseFloat(vals['4. close']);
    const v = parseFloat(vals['5. volume']) || 0;
    if ([o, h, l, c].some(val => isNaN(val))) continue;
    bars.push({ time: date, open: o, high: h, low: l, close: c, volume: v });
  }
  bars.sort((a, b) => a.time < b.time ? -1 : a.time > b.time ? 1 : 0);
  if (bars.length < 2) throw definitiveError('Datos insuficientes para ' + ticker);
  return { bars, currency: 'USD', name: ticker, type: 'EQUITY' };
}

async function getMarketData(ticker, force) {
  const key = 'av_mkt_' + ticker;
  const cached = cacheGet(key);
  if (!force && cached && cached.bars && Date.now() - cached.ts < CACHE_TTL_MS) {
    return { bars: cached.bars, currency: cached.currency, name: cached.name || '', type: cached.type || '', source: 'caché' };
  }
  const target = `https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=${encodeURIComponent(ticker)}&outputsize=full&apikey=${AV_API_KEY}`;
  
  try {
    const json = await fetchJSON(target);
    const parsed = parseAlphaVantage(json, ticker);
    cacheSet(key, { bars: parsed.bars, currency: parsed.currency, name: parsed.name, type: parsed.type, ts: Date.now() });
    return { bars: parsed.bars, currency: parsed.currency, name: parsed.name, type: parsed.type, source: 'Alpha Vantage' };
  } catch (e) {
    if (e.definitive) throw e;
    if (cached && cached.bars && cached.bars.length) {
      return { bars: cached.bars, currency: cached.currency, name: cached.name || '', type: cached.type || '', source: 'caché antigua' };
    }
    throw new Error('Error de conexión con Alpha Vantage para ' + ticker + '.');
  }
}

/* ================================================================
   GRÁFICOS
   ================================================================ */
const CT = LightweightCharts;
const tsOpts = { borderColor: '#1e293b', rightOffset: 4, timeVisible: false };
const baseOpts = {
  layout: { background: { type: CT.ColorType.Solid, color: '#020617' }, textColor: '#94a3b8' },
  grid: { vertLines: { color: '#0f172a' }, horzLines: { color: '#0f172a' } },
  rightPriceScale: { borderColor: '#1e293b', minimumWidth: 64 },
  crosshair: { mode: CT.CrosshairMode.Normal },
};
function makeChart(box, timeScale) {
  return CT.createChart(box, Object.assign({
    width: box.clientWidth || 300,
    height: box.clientHeight || 200,
    timeScale,
  }, baseOpts));
}

const mainChart = makeChart($('mainChart'), tsOpts);
const mainSeries = mainChart.addCandlestickSeries({
  upColor: '#22c55e', downColor: '#ef4444', borderVisible: false,
  wickUpColor: '#22c55e', wickDownColor: '#ef4444',
});
const line1 = mainChart.addLineSeries({ color: '#3b82f6', lineWidth: 2, priceLineVisible: false });
const line2 = mainChart.addLineSeries({ color: '#f59e0b', lineWidth: 2, priceLineVisible: false });
const ov = {
  sma:       mainChart.addLineSeries({ color: '#60a5fa', lineWidth: 1, title: 'SMA 200', priceLineVisible: false }),
  ema:       mainChart.addLineSeries({ color: '#e879f9', lineWidth: 1, title: 'EMA 50',  priceLineVisible: false }),
  vwap:      mainChart.addLineSeries({ color: '#38bdf8', lineWidth: 1, title: 'VWAP',    priceLineVisible: false }),
  sar:       mainChart.addLineSeries({ color: '#facc15', lineWidth: 1, lineVisible: false,
               pointMarkersVisible: true, pointMarkersRadius: 2, priceLineVisible: false, lastValueVisible: false }),
  bbUp:      mainChart.addLineSeries({ color: 'rgba(148,163,184,0.5)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }),
  bbLo:      mainChart.addLineSeries({ color: 'rgba(148,163,184,0.5)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }),
  framaMid:  mainChart.addLineSeries({ color: '#10b981', lineWidth: 2, title: 'FRAMA', priceLineVisible: false, lastValueVisible: false }),
  framaUp:   mainChart.addLineSeries({ color: 'rgba(16,185,129,0.5)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }),
  framaLo:   mainChart.addLineSeries({ color: 'rgba(16,185,129,0.5)', lineWidth: 1, priceLineVisible: false, lastValueVisible: false }),
};
const mainSeriesAll = [mainSeries, line1, line2, ov.sma, ov.ema, ov.vwap, ov.sar, ov.bbUp, ov.bbLo, ov.framaMid, ov.framaUp, ov.framaLo];

// Subpaneles
const subs = {};
['rsi', 'macd', 'obv', 'stoch', 'atr'].forEach(k => {
  const panel = $(k + 'Panel');
  const box = panel.querySelector('.cbox');
  subs[k] = { key: k, panel, box, chart: makeChart(box, Object.assign({}, tsOpts, { visible: false })) };
});
const fixed100 = { autoscaleInfoProvider: () => ({ priceRange: { minValue: 0, maxValue: 100 } }) };
const dash = CT.LineStyle.Dashed;

const rsiS = subs.rsi.chart.addLineSeries(Object.assign({ color: '#a855f7', lineWidth: 2, priceLineVisible: false }, fixed100));
rsiS.createPriceLine({ price: 70, color: '#ef4444', lineWidth: 1, lineStyle: dash, axisLabelVisible: false });
rsiS.createPriceLine({ price: 30, color: '#22c55e', lineWidth: 1, lineStyle: dash, axisLabelVisible: false });

const macdL = subs.macd.chart.addLineSeries({ color: '#3b82f6', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
const macdS = subs.macd.chart.addLineSeries({ color: '#f97316', lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
const macdH = subs.macd.chart.addHistogramSeries({ priceLineVisible: false, lastValueVisible: false });

const obvS = subs.obv.chart.addLineSeries({ color: '#10b981', lineWidth: 2, priceLineVisible: false });

const stK = subs.stoch.chart.addLineSeries(Object.assign({ color: '#38bdf8', lineWidth: 1, priceLineVisible: false }, fixed100));
const stD = subs.stoch.chart.addLineSeries(Object.assign({ color: '#f43f5e', lineWidth: 1, priceLineVisible: false }, fixed100));
stK.createPriceLine({ price: 80, color: '#ef4444', lineWidth: 1, lineStyle: dash, axisLabelVisible: false });
stK.createPriceLine({ price: 20, color: '#22c55e', lineWidth: 1, lineStyle: dash, axisLabelVisible: false });

const atrS = subs.atr.chart.addLineSeries({ color: '#fbbf24', lineWidth: 2, priceLineVisible: false });

/* Redimensionado y Sincronización */
const fitters = [{ chart: mainChart, box: $('mainChart') }].concat(Object.values(subs));
let syncing = false;

function fit(f) {
  const w = f.box.clientWidth, h = f.box.clientHeight;
  if (w > 0 && h > 0) f.chart.applyOptions({ width: w, height: h });
}
function syncSubs() {
  const r = mainChart.timeScale().getVisibleLogicalRange();
  if (!r) return;
  syncing = true;
  try {
    Object.values(subs).forEach(s => {
      if (!s.panel.classList.contains('hidden')) s.chart.timeScale().setVisibleLogicalRange(r);
    });
  } catch {} finally { syncing = false; }
}
if ('ResizeObserver' in window) {
  const ro = new ResizeObserver(entries => {
    entries.forEach(en => { const f = fitters.find(x => x.box === en.target); if (f) fit(f); });
    syncSubs();
  });
  fitters.forEach(f => ro.observe(f.box));
}
window.addEventListener('resize', () => { fitters.forEach(fit); syncSubs(); });

const syncList = fitters.map(f => ({ chart: f.chart, panel: f.panel || null }));
syncList.forEach(src => {
  src.chart.timeScale().subscribeVisibleLogicalRangeChange(r => {
    if (syncing || !r) return;
    if (src.panel && src.panel.classList.contains('hidden')) return;
    syncing = true;
    try {
      syncList.forEach(dst => {
        if (dst === src) return;
        if (dst.panel && dst.panel.classList.contains('hidden')) return;
        dst.chart.timeScale().setVisibleLogicalRange(r);
      });
    } catch {} finally { syncing = false; }
  });
});

/* ================================================================
   ESTADO Y RENDER
   ================================================================ */
const state = { comparing: false, base100: false, active: new Set(), bars: [], reqId: 0 };
let fibLines = [];

const toLine = (bars, vals) => bars.map((b, i) =>
  Number.isFinite(vals[i]) ? { time: b.time, value: vals[i] } : { time: b.time });
const toHist = (bars, vals) => bars.map((b, i) =>
  Number.isFinite(vals[i]) ? { time: b.time, value: vals[i], color: vals[i] >= 0 ? '#22c55e' : '#ef4444' } : { time: b.time });

const priceDecimals = p => p >= 10 ? 2 : p >= 1 ? 3 : 6;
const fmt = v => Number(v).toFixed(priceDecimals(Math.abs(v)));
function applyPrecision(price) {
  const d = priceDecimals(price);
  const priceFormat = { type: 'price', precision: d, minMove: Math.pow(10, -d) };
  mainSeriesAll.forEach(s => s.applyOptions({ priceFormat }));
}

function clearFib() {
  fibLines.forEach(l => { try { mainSeries.removePriceLine(l); } catch {} });
  fibLines = [];
}
function drawFib(bars) {
  clearFib();
  let hi = -Infinity, lo = Infinity;
  bars.forEach(b => { if (b.high > hi) hi = b.high; if (b.low < lo) lo = b.low; });
  const d = hi - lo;
  const levels = [
    ['0% (máx)', hi], ['38.2%', hi - d * 0.382], ['50%', hi - d * 0.5],
    ['61.8%', hi - d * 0.618], ['100% (mín)', lo],
  ];
  levels.forEach(([name, price]) => {
    const gold = name.startsWith('61.8');
    fibLines.push(mainSeries.createPriceLine({
      price, color: gold ? '#f59e0b' : '#64748b', lineWidth: gold ? 2 : 1, lineStyle: dash,
      axisLabelVisible: true, title: 'Fib ' + name,
    }));
  });
}

function setPanel(key, show) { subs[key].panel.classList.toggle('hidden', !show); }

function recalc() {
  const bars = state.bars, n = bars.length;
  const on = k => !state.comparing && n > 0 && state.active.has(k);
  const closes = bars.map(b => b.close);
  const highs = bars.map(b => b.high);
  const lows = bars.map(b => b.low);
  const put = (series, k, fn) => series.setData(on(k) ? fn() : []);

  put(ov.sma, 'sma200', () => toLine(bars, sma(closes, 200)));
  put(ov.ema, 'ema50',  () => toLine(bars, ema(closes, 50)));
  put(ov.vwap, 'vwap',  () => toLine(bars, vwapAnchored(bars, Math.max(0, n - VISIBLE_BARS))));
  put(ov.sar, 'sar',    () => toLine(bars, parabolicSar(bars)));
  
  if (on('bollinger')) {
    const bb = bollinger(closes);
    ov.bbUp.setData(toLine(bars, bb.up));
    ov.bbLo.setData(toLine(bars, bb.lo));
  } else { ov.bbUp.setData([]); ov.bbLo.setData([]); }

  if (on('frama')) {
    const fb = framaBollinger(closes, highs, lows);
    ov.framaMid.setData(toLine(bars, fb.mid));
    ov.framaUp.setData(toLine(bars, fb.up));
    ov.framaLo.setData(toLine(bars, fb.lo));
  } else {
    ov.framaMid.setData([]);
    ov.framaUp.setData([]);
    ov.framaLo.setData([]);
  }

  clearFib();
  if (on('fibonacci')) drawFib(bars.slice(-VISIBLE_BARS));

  const showRsi = on('rsi');
  setPanel('rsi', showRsi);
  rsiS.setData(showRsi ? toLine(bars, rsi(closes)) : []);

  const showMacd = on('macd');
  setPanel('macd', showMacd);
  if (showMacd) {
    const m = macd(closes);
    macdL.setData(toLine(bars, m.line));
    macdS.setData(toLine(bars, m.signal));
    macdH.setData(toHist(bars, m.hist));
  } else { macdL.setData([]); macdS.setData([]); macdH.setData([]); }

  const showObv = on('obv');
  setPanel('obv', showObv);
  obvS.setData(showObv ? toLine(bars, obv(bars)) : []);

  const showSt = on('stoch');
  setPanel('stoch', showSt);
  if (showSt) {
    const s = stoch(bars);
    stK.setData(toLine(bars, s.k));
    stD.setData(toLine(bars, s.d));
  } else { stK.setData([]); stD.setData([]); }

  const showAtr = on('atr');
  setPanel('atr', showAtr);
  atrS.setData(showAtr ? toLine(bars, atr(bars)) : []);

  fitters.forEach(fit);
  syncSubs();
}

function clearAll() {
  state.bars = [];
  mainSeries.setData([]); line1.setData([]); line2.setData([]);
  recalc();
}

function showRecent(n) {
  try {
    mainChart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - VISIBLE_BARS) - 0.5, to: n + 4 });
  } catch {}
}

function renderSingle(d, t) {
  state.bars = d.bars;
  line1.setData([]); line2.setData([]);
  const last = d.bars[d.bars.length - 1];
  applyPrecision(last.close);
  mainSeries.setData(d.bars);
  recalc();
  showRecent(d.bars.length);
  setLegend(`${t}: ${fmt(last.close)} USD · ${last.time} · Fuente: ${d.source}`);
}

function renderCompare(d1, t1, d2, t2) {
  state.bars = [];
  mainSeries.setData([]);
  recalc();
  line1.applyOptions({ title: t1 });
  line2.applyOptions({ title: t2 });

  if (state.base100) {
    let a = d1.bars.slice(-VISIBLE_BARS), b = d2.bars.slice(-VISIBLE_BARS);
    const start = a[0].time > b[0].time ? a[0].time : b[0].time;
    a = a.filter(x => x.time >= start);
    b = b.filter(x => x.time >= start);
    if (!a.length || !b.length) throw new Error('Los dos activos no tienen fechas en común.');
    applyPrecision(100);
    line1.setData(a.map(x => ({ time: x.time, value: x.close / a[0].close * 100 })));
    line2.setData(b.map(x => ({ time: x.time, value: x.close / b[0].close * 100 })));
    showRecent(a.length);
    setLegend(`Base 100 desde ${start}: ${t1} vs ${t2}`);
  } else {
    const l1 = d1.bars[d1.bars.length - 1], l2 = d2.bars[d2.bars.length - 1];
    applyPrecision(Math.min(l1.close, l2.close));
    line1.setData(d1.bars.map(x => ({ time: x.time, value: x.close })));
    line2.setData(d2.bars.map(x => ({ time: x.time, value: x.close })));
    showRecent(Math.max(d1.bars.length, d2.bars.length));
    setLegend(`${t1}: ${fmt(l1.close)} | ${t2}: ${fmt(l2.close)}`);
  }
}

async function resolveSymbol(raw, input) {
  if (input && input.dataset.picked && input.dataset.picked === raw) return raw;
  const up = raw.toUpperCase().trim();
  if (/^[A-Z0-9.]{1,10}$/.test(up)) return up;
  throw new Error('Símbolo inválido. Usa tickers estándar (ej: IBM, AAPL, TSLA, SPY, MSFT).');
}

/* ================================================================
   EVENTOS DE BÚSQUEDA Y UI
   ================================================================ */
async function updateChart(force = false) {
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const in1 = $('inputAsset1'), in2 =$('inputAsset2');
  const raw1 = in1.value.trim(), raw2 = in2.value.trim();
  const my = ++state.reqId;

  if (!raw1) { clearAll(); setLegend('Escribe un ticker (ej: AAPL, TSLA) o pulsa 📌 para cargar tu anclado'); stopTimer(); return; }

  startTimer();
  try {
    const t1 = await resolveSymbol(raw1, in1);
    if (my !== state.reqId) return;
    in1.value = t1; in1.dataset.picked = t1;
    
    const t2 = (state.comparing && raw2) ? await resolveSymbol(raw2, in2) : '';
    if (my !== state.reqId) return;
    if (t2) { in2.value = t2; in2.dataset.picked = t2; }

    const d1 = await getMarketData(t1, force);
    if (my !== state.reqId) return;
    
    if (!state.comparing) { renderSingle(d1, t1); return; }
    if (!t2) {
      renderSingle(d1, t1);
      setLegend(`${t1}: introduce el Activo 2 para comparar`);
      return;
    }
    const d2 = await getMarketData(t2, force);
    if (my !== state.reqId) return;
    renderCompare(d1, t1, d2, t2);
  } catch (err) {
    if (my !== state.reqId) return;
    clearAll();
    setLegend(err.message || String(err), true);
  } finally {
    if (my === state.reqId) stopTimer();
  }
}

$('searchForm').addEventListener('submit', e => { e.preventDefault(); updateChart(); });

/* --- Gestión de anclaje (Pin) --- */
const btnPin = $('btnPin');
function checkPinState() {
  const currentVal = $('inputAsset1').value.trim().toUpperCase();
  const pinned = localStorage.getItem(PINNED_KEY);
  if (pinned && currentVal === pinned) {
    btnPin.classList.add('pinned');
    btnPin.title = 'Activo anclado por defecto';
  } else {
    btnPin.classList.remove('pinned');
    btnPin.title = 'Anclar activo actual por defecto';
  }
}

btnPin.addEventListener('click', () => {
  const val = $('inputAsset1').value.trim().toUpperCase();
  if (!val) {
    flash('Escribe un ticker válido antes de anclar.');
    return;
  }
  const currentPinned = localStorage.getItem(PINNED_KEY);
  if (currentPinned === val) {
    localStorage.removeItem(PINNED_KEY);
    btnPin.classList.remove('pinned');
    flash('Activo desanclado.');
  } else {
    localStorage.setItem(PINNED_KEY, val);
    btnPin.classList.add('pinned');
    flash(`¡Activo ${val} anclado por defecto!`);
  }
});

$('inputAsset1').addEventListener('input', checkPinState);

$('btnToggleCompare').addEventListener('click', e => {
  state.comparing = !state.comparing;
  const btn = e.currentTarget;
  btn.textContent = 'Comparar: ' + (state.comparing ? 'ON' : 'OFF');
  btn.classList.toggle('on', state.comparing);
  $('compareRow').classList.toggle('hidden', !state.comparing);
  if (!state.comparing) {
    state.base100 = false;
    $('btnBase100').textContent = 'Base 100: OFF';$('btnBase100').classList.remove('on');
    line1.setData([]); line2.setData([]);
  }
  fitters.forEach(fit);
  updateChart();
});

$('btnBase100').addEventListener('click', e => {
  state.base100 = !state.base100;
  e.currentTarget.textContent = 'Base 100: ' + (state.base100 ? 'ON' : 'OFF');
  e.currentTarget.classList.toggle('on', state.base100);
  updateChart();
});

$('btnRefresh').addEventListener('click', () => updateChart(true));

document.querySelectorAll('.ind-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (state.comparing) { flash('Los indicadores solo están disponibles con un activo.'); return; }
    const k = btn.dataset.indicator;
    if (state.active.has(k)) state.active.delete(k); else state.active.add(k);
    btn.classList.toggle('on', state.active.has(k));
    recalc();
  });
});

/* ================================================================
   ARRANQUE
   ================================================================ */
fitters.forEach(fit);

const pinnedAsset = localStorage.getItem(PINNED_KEY);
if (pinnedAsset) {
  $('inputAsset1').value = pinnedAsset;
  btnPin.classList.add('pinned');
  updateChart();
} else {
  setLegend('Escribe un ticker (ej: AAPL) o ancla tu favorito con 📌');
}
checkPinState();
</script>
